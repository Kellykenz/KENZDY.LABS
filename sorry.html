<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>KENZDY.LABS</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;700&family=Clash+Display:wght@600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="sorry.css">
    <style>
        body {
            background-color: #0f0f0f;
            font-family: 'Inter', sans-serif;
            color: #94A3B8;
        }
        h1 { font-family: 'Clash Display', sans-serif; }
        
        .glow {
            box-shadow: 0 0 50px -10px rgba(139, 92, 246, 0.3);
        }
    </style>
</head>
<body class="h-screen flex items-center justify-center p-6">

    <div class="max-w-xl w-full text-center">
        <div class="mb-12 inline-block">
            <div class="h-16 w-16 rounded-2xl bg-zinc-900 border border-zinc-800 flex items-center justify-center glow mx-auto">
                <div class="h-2 w-2 rounded-full bg-[#8B5CF6] animate-ping"></div>
            </div>
        </div>

        <h1 class="text-4xl md:text-6xl text-white mb-6 tracking-tight">
            Sorry, we'll be <span class="text-[#8B5CF6]">back soon.</span>
        </h1>
        
        <p class="text-lg text-zinc-500 mb-10 leading-relaxed">
            We’re currently updating the experience to serve you better. 
            The wait will be worth it.
        </p>

        <div class="pt-8 border-t border-zinc-900">
            <p class="text-xs uppercase tracking-[0.2em] text-zinc-600 mb-4">Urgent inquiry?</p>
            <a href="mailto:hello@yourdomain.com" class="text-white hover:text-[#D9F99D] transition-colors duration-300 font-medium">
                hello@Kenzdy
            </a>
        </div>
    </div>

</body>
</html>
